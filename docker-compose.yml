version: '3.8'
services:
  mongo:
    image: mongo:6
    container_name: codejudge_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=codejudge
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/codejudge --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codejudge_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: codejudge_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/codejudge
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - S3_BUCKET=${S3_BUCKET:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-in-Docker execution

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5000/api}
    container_name: codejudge_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5000/api}

  executor:
    build: ./executor
    container_name: codejudge_executor
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/codejudge
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-in-Docker execution
      - ./backend/src:/app/backend/src:ro  # Read-only access to backend models/services

  # Language runners are pulled on demand in dockerExecutor.js

volumes:
  mongo_data: