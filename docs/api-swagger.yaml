openapi: 3.0.0
info:
  title: Code Judge API
  version: 1.0.0
paths:
  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { type: object }
  /problems:
    get:
      summary: Get problems
      parameters:
        - name: difficulty
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of problems
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Problem' }
    post:
      summary: Create problem (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Problem' }
      responses:
        '201':
          description: Problem created
  /submissions:
    post:
      summary: Submit code
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                problemId: { type: string }
                code: { type: string }
                language: { type: string }
      responses:
        '201':
          description: Submission queued
components:
  schemas:
    Problem:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        # ... other fields
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT